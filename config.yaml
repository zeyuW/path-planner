# ============================================================================
# Path Planner 算法参数
#
# 修改本文件只会影响选面 / 视点 / 路径的结果与耗时，不影响程序结构。
# 每个参数都标注了「调大 / 调小」的大致影响。
# ============================================================================

# ---------- STEP 预处理：自动识别待测表面 ----------
step_preprocessing:
  # 覆盖边界向外扩的距离（mm），只外扩外轮廓、孔洞大小不变。
  # 调大：覆盖范围更超出真实表面、更不容易漏边，但视点会变多。
  boundary_expansion_mm: 50

  # 候选面法向与厚度轴正向/反向的最大偏差角（度）。
  # 调大：选面更宽松（可能混入偏斜的面）；调小：更严格。
  normal_tolerance_deg: 25

  # 相邻面合并时，两面面积加权平均法向允许的夹角（度）。
  # 调大：更容易把相邻面合并成一块。
  adjacency_angle_deg: 15

  # 曲面离散成三角网格的误差参数（两个是不同维度）：
  #   线性偏差（mm）：调小 → 网格更贴合曲面、三角面更多。
  linear_deflection_mm: 0.5
  #   角度偏差（度）：调小 → 弧面细分更细。
  angular_deflection_deg: 10
  # 离散后三角形最大边长（mm）：调小 → 三角面更多、更精确、更慢。
  mesh_size_mm: 40

# ---------- 视点规划：铺矩形生成相机视点 ----------
viewpoint:
  # 单个相机视场覆盖矩形的宽/高（mm），通常等于相机实际视场尺寸。
  rectangle_width_mm: 324
  rectangle_height_mm: 297

  # 覆盖矩形缩放系数（0~1）。小于 1 让相邻矩形有重叠、避免漏缝。
  # 调小：重叠更多、更不容易漏，但视点更多。
  scale_factor: 0.9

  # 视点阶段的外扩量（mm）。STEP 前处理已外扩过边界，这里保持 0 避免重复外扩。
  boundary_expansion_mm: 0

  # 矩形候选旋转角度步长（度）。调小：角度更密、覆盖更精细，但更慢。
  angle_step_deg: 45

  # 贪心铺矩形的最大迭代次数。调大：可能铺得更满，但更慢。
  max_cover_iterations: 500

  # 生成矩形候选中心点的网格间距（mm）。调小：候选点更密、更精细、更慢。
  candidate_grid_size_mm: 250

  # 一个矩形内至少包含多少个三角面片才生成视点。调大：过滤掉更多小矩形。
  triangle_threshold: 30

  # 相机工作距离（mm）：视点沿表面法向偏移这个距离放置。
  viewpoint_offset_mm: 300

  # 可见性角度阈值（度）：面片被判定覆盖所需的最小视角夹角（正对表面为 180°）。
  # 调大：要求更正对、判定更严格、覆盖更少；调小：更宽松、覆盖更多。
  visibility_angle_threshold_deg: 120

  # 补点阶段对剩余面片做 DBSCAN 聚类的参数：
  #   eps：邻域半径（mm）；min_samples：聚成一簇的最少面片数。
  # 剩余面片太零散、凑不够 min_samples 时不再补视点，
  # 覆盖率就会停在残余小面片上（日志会显示 no_candidates）。
  dbscan_eps_mm: 50
  dbscan_min_samples: 50

  # 补点循环最大轮数。调大：补点更充分，但更慢。
  max_refinement_cycles: 5

# ---------- 路径规划：视点排序 ----------
path_planning:
  # 沿主轴的视点分组间距（mm）。视点投影到主轴后按这个间距分组，组内再用蚁群排序。
  # 调小：分组更多、每组更小。
  group_step_mm: 500

  # 组内蚁群算法（固定起点和终点，求最短遍历顺序）
  ant_colony:
    ant_count: 20            # 蚂蚁数量：调大搜索更充分、更慢
    max_iterations: 200      # 最大迭代次数：调大更可能找到短路径、更慢
    alpha: 1.0               # 信息素重要度（指数）：调大更偏向已有信息素强的边
    beta: 2.0                # 启发式（距离）重要度（指数）：调大更偏向走短边
    evaporation_rate: 0.5    # 信息素挥发率（0~1）：调大旧信息素消散更快、搜索更随机
    pheromone_deposit: 100   # 信息素沉积量：调大路径间正反馈更强
    initial_pheromone: 0.1   # 初始信息素值：调大初期搜索更均匀

  # 路径图参数
  visualization:
    figure_size: [12, 10]    # 图片尺寸（宽, 高），单位英寸
    dpi: 300                 # 图片分辨率
    point_size: 100          # 视点散点大小
    start_marker: "*"        # 起点标记（matplotlib marker 样式）
    end_marker: s            # 终点标记
    line_width: 3            # 路径连线宽度
